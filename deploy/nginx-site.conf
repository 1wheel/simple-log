# nginx in front of the app. setup.sh fills in __DOMAIN__ and copies this to
# /etc/nginx/sites-available/simple-log; certbot then adds the https part to it.
server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;
  server_tokens off;

  # no framing by other sites, https only once it works, no full urls sent to other sites
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
  add_header Referrer-Policy same-origin always;

  client_max_body_size 16m;   # pictures

  # a passphrase is tiny; don't let strangers send big bodies here
  location = /api/login {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
