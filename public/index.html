<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="__VERSION__">
<title>write</title>
<link rel="manifest" href="/write/manifest.json">
<link rel="icon" href="/write/icon-192.png">
<link rel="apple-touch-icon" href="/write/icon-192.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/write/app.css">
<script>
// e-ink (a Boox and the like): html.eink, set here before anything is drawn. ?eink=1 / ?eink=0
// or the menu's switch decide for this device; otherwise it's a guess: an old Android Chrome
// (Boox ships an old WebView) or an e-ink model name.
(function(){
  var d = document.documentElement, K = 'simple-log-eink', q = /[?&]eink=([01])/.exec(location.search), set = q && q[1]
  window.eink = function(on){
    d.classList.toggle('eink', on)
    document.querySelector('link[rel=manifest]').href = on ? '/write/manifest-eink.json' : '/write/manifest.json'
  }
  try { if (set) localStorage.setItem(K, set); else set = localStorage.getItem(K) } catch (e){}
  if (set == '1' || set == '0') return eink(set == '1')
  var m = /Android.*Chrome\/(\d+)\./.exec(navigator.userAgent)
  if (m && +m[1] < 125) eink(true)
  var u = navigator.userAgentData
  if (u && u.getHighEntropyValues) u.getHighEntropyValues(['model']).then(function(v){
    if (/boox|onyx|palma|leaf|poke|nova|note ?air|tab ?(ultra|mini|x)|go ?(6|7|10)/i.test(v.model || '')) eink(true)
  }, function(){})
})()
</script>
</head>
<body>
<textarea id="text" spellcheck="true" autocapitalize="sentences" placeholder="Write." aria-label="The post"></textarea>

<button id="menu-btn" class="corner" aria-label="Menu" title="Menu (Esc)">&equiv;</button>
<div id="menu" hidden>
  <div class="row"><button id="new">New post</button><button id="image">Add image</button><button id="replay-btn">Replay</button></div>
  <div class="row"><label><input type="checkbox" id="public"> Public</label> <a id="public-link" target="_blank"></a></div>
  <div class="row"><button id="eink-btn">e-ink off</button><button id="fs-btn">full screen on</button></div>
  <ul id="list"></ul>
  <div class="row small"><a href="/">Home</a> <button id="logout" class="link">Sign out</button></div>
</div>

<div id="replay" hidden>
  <div id="replay-text"></div>
  <div class="controls"><button id="play">Pause</button><button id="speed">4&times;</button><input type="range" id="scrub" min="0" value="0"><button id="close-replay">Close</button></div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<footer id="foot"><button id="state" class="link">…</button> · <button id="version" class="link" title="Tap to force an update">app</button></footer>

<script src="/write/ot.js"></script>
<script src="/write/sync.js"></script>
<script src="/write/app.js"></script>
</body>
</html>
